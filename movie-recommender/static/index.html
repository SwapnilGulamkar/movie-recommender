<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Reel – movie recommendations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8edef;
    --panel: #12343b;
    --panel-ink: #eaf3f3;
    --panel-muted: #8fb3b6;
    --ink: #13242a;
    --muted: #5c747a;
    --line: #c9d5d8;
    --card: #f7fafa;
    --gold: #f0b429;
    --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --body: "Public Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--body); color: var(--ink); background: var(--bg); line-height: 1.5; }
  button, input, select { font: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .layout { display: grid; grid-template-columns: 360px 1fr; min-height: 100vh; }

  /* ---------- left: your shelf ---------- */
  .shelf {
    background: var(--panel); color: var(--panel-ink);
    padding: 36px 28px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; margin: 0 0 8px; }
  .lede { color: var(--panel-muted); margin: 0 0 28px; font-size: 15px; }
  .shelf label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }

  .search { position: relative; }
  .search input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 2px solid transparent;
    background: #0c262c; color: var(--panel-ink);
  }
  .search input::placeholder { color: var(--panel-muted); }
  .suggest {
    list-style: none; margin: 6px 0 0; padding: 4px; position: absolute; left: 0; right: 0; z-index: 5;
    background: #fff; color: var(--ink); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .suggest[hidden] { display: none; }
  .suggest button {
    display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
    background: none; border: 0; padding: 9px 10px; border-radius: 6px; cursor: pointer; color: inherit;
  }
  .suggest button:hover, .suggest button:focus-visible { background: #e6eff0; }
  .suggest .yr { color: var(--muted); }
  .suggest .none { padding: 9px 10px; color: var(--muted); }

  .picks-head { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 10px; }
  .picks-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .link { background: none; border: 0; color: var(--panel-muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }
  .picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .pick {
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 8px;
    background: #1b4750; border-left: 6px solid var(--hue, var(--gold));
  }
  .pick .t { flex: 1; font-weight: 500; }
  .pick .y { color: var(--panel-muted); font-size: 13px; }
  .pick button { background: none; border: 0; color: var(--panel-ink); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 6px; }
  .pick button:hover { background: #28606b; }
  .empty-picks { color: var(--panel-muted); font-size: 14px; margin: 0; }

  .filter { margin-top: 28px; }
  .filter select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 2px solid transparent;
    background: #0c262c; color: var(--panel-ink);
  }

  /* ---------- right: results ---------- */
  main { padding: 40px 44px 60px; }
  .results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .results-head h2 { font-family: var(--display); font-size: 30px; margin: 0; line-height: 1.15; }
  .results-head p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .poster {
    aspect-ratio: 3 / 2; padding: 16px; color: #fff; display: flex; align-items: flex-end;
    background: linear-gradient(160deg, var(--hue) 0%, color-mix(in srgb, var(--hue) 55%, #000) 100%);
  }
  .poster h3 { font-family: var(--display); font-size: 22px; line-height: 1.1; margin: 0; text-wrap: balance; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .meta { color: var(--muted); font-size: 13px; }
  .overview { margin: 0; font-size: 14px; }
  .why { margin: 0; font-size: 13px; color: var(--muted); }
  .why strong { color: var(--ink); font-weight: 600; }
  .meter { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
  .meter .bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .meter .fill { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
  .add {
    margin-top: auto; padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--panel);
    background: transparent; color: var(--panel); font-weight: 600; cursor: pointer;
  }
  .add:hover:not(:disabled) { background: var(--panel); color: var(--panel-ink); }
  .add:disabled { opacity: .5; cursor: default; }
  .notice { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
  .notice.error { border-color: #b3402c; color: #8a2c1b; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .shelf { position: static; height: auto; padding: 28px 20px; }
    main { padding: 28px 20px 48px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .fill { transition: width .5s ease-out; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="shelf">
    <h1 class="brand">Next Reel</h1>
    <p class="lede">Add a few movies you love. We'll find what to watch next.</p>

    <div class="search">
      <label for="q">Search movies</label>
      <input id="q" type="search" placeholder="Try “Inception” or “Toy Story”" autocomplete="off"
             aria-controls="suggest" aria-expanded="false">
      <ul class="suggest" id="suggest" hidden></ul>
    </div>

    <div class="picks-head">
      <h2>Movies you like</h2>
      <button class="link" id="clear" hidden>Clear all</button>
    </div>
    <ul class="picks" id="picks"></ul>
    <p class="empty-picks" id="emptyPicks">Nothing added yet.</p>

    <div class="filter">
      <label for="genre">Only recommend</label>
      <select id="genre"><option value="">Any genre</option></select>
    </div>
  </aside>

  <main>
    <div class="results-head">
      <h2 id="title">Top rated to start with</h2>
      <p id="sub">Add any of these to your list, or search for your own.</p>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </main>
</div>

<script>
const HUES = {
  Action: "#b5472f", Adventure: "#2f7d6a", Animation: "#d08a1e", Biography: "#6b5b8c",
  Comedy: "#c26a8a", Crime: "#4a5568", Drama: "#2f5f8f", Family: "#5d9a3a", Fantasy: "#7a4fa3",
  History: "#8a6a3b", Horror: "#8e2230", Music: "#b0508f", Mystery: "#3b6b7a",
  Romance: "#c24a5a", "Sci-Fi": "#2a7f9e", Thriller: "#5a4a7a", War: "#5b6b3a"
};
const hueOf = m => HUES[m.genres[0]] || "#2f5f8f";

const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => n.append(k));
  return n;
};

let picks = [];
try { picks = JSON.parse(localStorage.getItem("picks") || "[]"); } catch (_) {}
const save = () => { try { localStorage.setItem("picks", JSON.stringify(picks)); } catch (_) {} };
const isPicked = id => picks.some(p => p.id === id);

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

/* ---------- search ---------- */
let timer;
$("q").addEventListener("input", e => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (!q) return hideSuggest();
  timer = setTimeout(async () => {
    const list = await api("/api/search?q=" + encodeURIComponent(q));
    const ul = $("suggest");
    ul.replaceChildren();
    if (!list.length) ul.append(el("li", { className: "none", textContent: "No movie with that title." }));
    list.forEach(m => ul.append(el("li", {}, el("button", {
      type: "button",
      onclick: () => { addPick(m); $("q").value = ""; hideSuggest(); }
    }, el("span", { textContent: m.title }), el("span", { className: "yr", textContent: m.year })))));
    ul.hidden = false; $("q").setAttribute("aria-expanded", "true");
  }, 150);
});
function hideSuggest() { $("suggest").hidden = true; $("q").setAttribute("aria-expanded", "false"); }
document.addEventListener("click", e => { if (!e.target.closest(".search")) hideSuggest(); });
$("q").addEventListener("keydown", e => { if (e.key === "Escape") hideSuggest(); });

/* ---------- picks ---------- */
function addPick(m) {
  if (isPicked(m.id)) return;
  picks.push({ id: m.id, title: m.title, year: m.year, genres: m.genres });
  save(); renderPicks(); refresh();
}
function removePick(id) { picks = picks.filter(p => p.id !== id); save(); renderPicks(); refresh(); }

function renderPicks() {
  const ul = $("picks");
  ul.replaceChildren(...picks.map(p => el("li", { className: "pick", style: `--hue:${hueOf(p)}` },
    el("span", { className: "t", textContent: p.title }),
    el("span", { className: "y", textContent: p.year }),
    el("button", { type: "button", textContent: "×", title: "Remove", ariaLabel: "Remove " + p.title, onclick: () => removePick(p.id) })
  )));
  $("emptyPicks").hidden = picks.length > 0;
  $("clear").hidden = picks.length === 0;
}
$("clear").addEventListener("click", () => { picks = []; save(); renderPicks(); refresh(); });
$("genre").addEventListener("change", refresh);

/* ---------- results ---------- */
function card(m) {
  const why = [];
  if (m.shared_genres && m.shared_genres.length) why.push(el("strong", { textContent: "Shares " + m.shared_genres.join(", ") }));
  if (m.shared_keywords && m.shared_keywords.length) why.push(" · themes: " + m.shared_keywords.join(", "));
  return el("article", { className: "card" },
    el("div", { className: "poster", style: `--hue:${hueOf(m)}` }, el("h3", { textContent: m.title })),
    el("div", { className: "body" },
      el("div", { className: "meta", textContent: `${m.year} · ${m.genres.join(", ")} · ★ ${m.rating}` }),
      m.match != null && el("div", { className: "meter" },
        el("span", { textContent: m.match + "% match" }),
        el("span", { className: "bar" }, el("span", { className: "fill", style: `width:${m.match}%` }))),
      el("p", { className: "overview", textContent: m.overview }),
      why.length ? el("p", { className: "why" }, ...why) : "",
      el("button", {
        className: "add", type: "button",
        textContent: isPicked(m.id) ? "In your list" : "I like this",
        disabled: isPicked(m.id),
        onclick: () => addPick(m)
      })
    ));
}

async function refresh() {
  const grid = $("grid"), genre = $("genre").value;
  try {
    if (!picks.length) {
      const list = await api("/api/browse?limit=12" + (genre ? "&genre=" + encodeURIComponent(genre) : ""));
      $("title").textContent = genre ? `Top rated in ${genre}` : "Top rated to start with";
      $("sub").textContent = "Add any of these to your list, or search for your own.";
      grid.replaceChildren(...list.map(card));
      return;
    }
    const list = await api("/api/recommend", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ liked: picks.map(p => p.id), n: 9, genre })
    });
    $("title").textContent = "Because you liked " + (picks.length === 1 ? picks[0].title : `${picks.length} movies`);
    $("sub").textContent = "Match is relative to your closest result.";
    grid.replaceChildren(...(list.length ? list.map(card)
      : [el("div", { className: "notice", textContent: "No matches for that genre. Pick a different genre or add more movies." })]));
  } catch (err) {
    grid.replaceChildren(el("div", { className: "notice error", textContent: err.message + " Check that the server is running." }));
  }
}

(async function init() {
  const genres = await api("/api/genres").catch(() => []);
  genres.forEach(g => $("genre").append(el("option", { value: g, textContent: g })));
  renderPicks(); refresh();
})();
</script>
</body>
</html>
